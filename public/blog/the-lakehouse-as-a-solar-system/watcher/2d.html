<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<script src="mock-api.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Watcher (demo) · 2D</title>
<style>
.demo-chip{font:600 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#15101f;background:#f3e600;padding:4px 7px;border-radius:3px;margin-left:10px;vertical-align:middle}

:root {
  color-scheme: dark;
  --bg: #0f1012;
  --panel: #1a1a19;
  --panel-2: #222220;
  --line: #2f2f2c;
  --ring: #3a3a36;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #8d8c84;
  --accent: #3987e5;
  --st-success: #0ca30c;
  --st-running: #3987e5;
  --st-stale: #fab219;
  --st-skipped: #ec835a;
  --st-failed: #d03b3b;
  --st-idle: #5d5c57;
  --sun-1: #ffd27a;
  --sun-2: #f08a24;
  --edge: #8d8c84;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f3f1;
  --panel: #fcfcfb;
  --panel-2: #f0f0ed;
  --line: #e2e1dc;
  --ring: #d4d3cd;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #77766f;
  --accent: #2a78d6;
  --st-running: #2a78d6;
  --st-idle: #b8b7b0;
  --edge: #77766f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text-primary);
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 12px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--st-idle); }
.live.on i { background: var(--st-success); box-shadow: 0 0 0 0 var(--st-success); animation: beat 2s infinite; }
@keyframes beat { 0% { box-shadow: 0 0 0 0 rgba(12,163,12,.6); } 70% { box-shadow: 0 0 0 6px rgba(12,163,12,0); } 100% { box-shadow: 0 0 0 0 rgba(12,163,12,0); } }
.scope { color: var(--text-secondary); font-size: 12px; }
.scope b { color: var(--text-primary); font-weight: 600; }
.spacer { flex: 1; }
.controls { display: flex; gap: 8px; align-items: center; }
input[type=search] {
  background: var(--panel-2); color: var(--text-primary); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 9px; width: 190px; font: inherit;
}
button {
  background: var(--panel-2); color: var(--text-primary); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer;
}
button:hover { border-color: var(--text-muted); }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
#stage { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: auto 1fr auto; }
#progress { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; padding: 12px 16px 0; }
.tier { font-size: 11px; color: var(--text-secondary); }
.tier .name { display: flex; justify-content: space-between; margin-bottom: 4px; }
.tier .name b { color: var(--text-primary); font-weight: 600; }
.bar { display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--panel-2); }
.bar span { height: 100%; }
.bar span:first-child { border-radius: 3px 0 0 3px; }
.bar span:last-child { border-radius: 0 3px 3px 0; }
#orbitWrap { position: relative; min-height: 0; }
svg#orbit { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ring { fill: none; stroke: var(--ring); stroke-width: 1; stroke-dasharray: 2 4; }
.ring-label { fill: var(--text-muted); font-size: 10.5px; letter-spacing: .4px; text-transform: uppercase; }
.planet { cursor: pointer; }
.planet circle.body { stroke: var(--bg); stroke-width: 1.5; }
.planet.dim { opacity: .18; }
.planet.match circle.body { stroke: var(--text-primary); stroke-width: 2; }
.planet:focus { outline: none; }
.planet.sel circle.body, .planet:focus-visible circle.body { stroke: var(--text-primary); stroke-width: 2.5; }
.halo { fill: none; stroke-width: 1.5; pointer-events: none; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1; opacity: .55; pointer-events: none; }
.edge.up { stroke: var(--accent); opacity: .8; }
.edge.down { stroke: var(--st-stale); opacity: .8; }
.comet { pointer-events: none; }
#legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 8px 16px 12px; color: var(--text-secondary); font-size: 12px; }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.ico { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-size: 10px; font-weight: 700; color: #fff; flex: none; }
.ico.success { background: var(--st-success); }
.ico.running { background: var(--st-running); }
.ico.stale { background: var(--st-stale); color: #1a1a19; }
.ico.skipped { background: var(--st-skipped); color: #1a1a19; }
.ico.failed { background: var(--st-failed); }
.ico.idle { background: var(--st-idle); }
.ico.queued { background: var(--st-idle); }

aside { border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 10px; color: var(--text-secondary); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--accent); }
.pane { overflow: auto; padding: 12px 14px; min-height: 0; }
.pane[hidden] { display: none; }
.run { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; margin-bottom: 8px; cursor: pointer; background: var(--panel-2); }
.run:hover { border-color: var(--text-muted); }
.run.sel { border-color: var(--accent); }
.run .top { display: flex; align-items: center; gap: 8px; }
.run .dag { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run .meta { color: var(--text-muted); font-size: 11.5px; margin: 3px 0 6px 24px; }
.run .bar { margin-left: 24px; }
.muted { color: var(--text-muted); }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; margin: 8px 0 14px; font-size: 12.5px; }
.kv dt { color: var(--text-muted); }
.kv dd { margin: 0; word-break: break-word; }
h2 { font-size: 14px; margin: 0 0 2px; word-break: break-all; }
#pane-detail > .muted { word-break: break-all; font-size: 11.5px; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin: 16px 0 6px; font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--text-muted); font-weight: 500; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); border-radius: 12px; padding: 1px 8px; font-size: 11.5px; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
.chip:hover { border-color: var(--text-muted); }
.err { color: var(--st-failed); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11.5px; background: var(--panel-2); padding: 8px; border-radius: 6px; }
a { color: var(--accent); }
#tip {
  position: fixed; pointer-events: none; z-index: 10; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.35); max-width: 320px; display: none;
}
#tip .t { font-weight: 600; margin-bottom: 4px; word-break: break-all; }
#tip .row { display: flex; gap: 6px; align-items: center; color: var(--text-secondary); }
.empty { color: var(--text-muted); padding: 20px 4px; text-align: center; }

@media (max-width: 900px) {
  body { display: block; overflow: auto; height: auto; }
  main { display: block; }
  #stage { display: block; }
  #orbitWrap { height: min(100vw, 560px); }
  #progress { grid-template-columns: repeat(4, 1fr); padding: 10px 16px 0; }
  aside { border-left: 0; border-top: 1px solid var(--line); min-height: 60vh; }
  input[type=search] { width: 140px; }
}
</style>
</head>
<body>
<header>
  <h1>◉ The Watcher<span class="demo-chip" title="This copy runs on simulated data generated in your browser: an invented shop, invented tables, invented runs.">demo · simulated data</span></h1>
  <span class="live" id="live"><i></i><span>connecting…</span></span>
  <span class="scope" id="scope">Showing <b>latest status</b> of every node</span>
  <span class="spacer"></span>
  <div class="controls">
    <input type="search" id="search" placeholder="Find model…" aria-label="Find model">
    <button id="spin" aria-pressed="true" title="Pause / resume orbit motion">Orbit ⟳</button>
    <button id="theme" title="Toggle light / dark">◐</button>
  </div>
</header>
<main>
  <section id="stage">
    <div id="progress" aria-label="Progress per lifecycle layer"></div>
    <div id="orbitWrap"><svg id="orbit" role="img" aria-label="Lakehouse lifecycle orbit: raw sources on the outer ring flow inward through silver and gold to snapshots"></svg></div>
    <div id="legend"></div>
  </section>
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-pane="runs">Runs</button>
      <button role="tab" aria-selected="false" data-pane="detail">Detail</button>
      <button role="tab" aria-selected="false" data-pane="list">Table</button>
    </div>
    <div class="pane" id="pane-runs"></div>
    <div class="pane" id="pane-detail" hidden><div class="empty">Click a planet to inspect a model.</div></div>
    <div class="pane" id="pane-list" hidden></div>
  </aside>
</main>
<div id="tip"></div>

<script src="./vendor/d3.min.js"></script>
<script>
// ── Constants ───────────────────────────────────────────────────────────────────────────────
// Lifecycle order: raw on the outer ring, refined inward toward the core.
const TIERS = [
  { key: "raw",         label: "Raw / Bronze",  r: 0.95 },
  { key: "silver",      label: "Silver L1",     r: 0.79 },
  { key: "integration", label: "Integration",   r: 0.645 },
  { key: "gold_dim",    label: "Gold dims",     r: 0.53 },
  { key: "gold_fact",   label: "Gold facts",    r: 0.405 },
  { key: "gold_mart",   label: "Marts",         r: 0.30 },
  { key: "snapshot",    label: "Snapshots",     r: 0.205 },
];
const TIER = Object.fromEntries(TIERS.map((t, i) => [t.key, { ...t, i }]));
const STATUS = {
  success: { label: "Success", icon: "✓" },
  running: { label: "Running", icon: "▶" },
  failed:  { label: "Failed",  icon: "✕" },
  stale:   { label: "Stale",   icon: "!" },
  skipped: { label: "Skipped", icon: "–" },
  idle:    { label: "No runs yet", icon: "○" },
};
const STATUS_ORDER = ["failed", "running", "stale", "skipped", "success", "idle"];
const AF_STATE = { success: "success", running: "running", failed: "failed", queued: "idle",
                   upstream_failed: "failed", skipped: "skipped", up_for_retry: "stale" };
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const color = s => css(`--st-${s}`);
const ico = s => `<span class="ico ${s}" aria-hidden="true">${STATUS[s]?.icon ?? ""}</span>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDur = s => s == null ? "—" : s < 60 ? `${s.toFixed(1)}s` : s < 3600 ? `${Math.floor(s / 60)}m ${Math.round(s % 60)}s` : `${Math.floor(s / 3600)}h ${Math.round(s % 3600 / 60)}m`;
const fmtAgo = iso => {
  if (!iso) return "—";
  const s = (Date.now() - new Date(iso)) / 1000;
  return s < 60 ? `${Math.max(0, Math.round(s))}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : `${Math.round(s / 86400)}d ago`;
};
const fmtNum = n => n == null ? "—" : Number(n).toLocaleString();

// ── State ───────────────────────────────────────────────────────────────────────────────────
let cfg = {}, nodes = [], byId = new Map(), up = new Map(), down = new Map();
let live = { nodes: {}, dag_runs: [] };
let scope = null;            // { dag_id, run_id, nodeRuns: Map } when a run is selected
let selected = null, hovered = null, spinning = true, query = "";
let rot = 0, lastT = performance.now();
const ripples = [];          // status-change flashes
let prevStatus = new Map();

const svg = d3.select("#orbit");
const gRings = svg.append("g"), gEdges = svg.append("g"), gComets = svg.append("g"),
      gPlanets = svg.append("g"), gSun = svg.append("g"), gFx = svg.append("g");
let W = 0, H = 0, S = 0, cx = 0, cy = 0;

// ── Layout: angle per node, barycentric to its upstreams so lineage stays short ─────────────
function layout(topo) {
  nodes = topo.nodes.map(n => ({ ...n }));
  byId = new Map(nodes.map(n => [n.id, n]));
  for (const n of nodes) { up.set(n.id, []); down.set(n.id, []); }
  for (const e of topo.edges) {
    if (!byId.has(e.src) || !byId.has(e.dst)) continue;
    up.get(e.dst).push(e.src); down.get(e.src).push(e.dst);
  }
  const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0) / 4294967296; };
  for (const t of TIERS) {
    const ring = nodes.filter(n => n.tier === t.key);
    for (const n of ring) {
      const ups = up.get(n.id).map(id => byId.get(id)).filter(u => u.theta != null);
      if (t.key === "raw" || !ups.length) {
        // raw: group by source system name so a source's tables sit together
        n.want = t.key === "raw" ? null : hash(n.name) * 2 * Math.PI;
      } else {
        const x = d3.mean(ups, u => Math.cos(u.theta)), y = d3.mean(ups, u => Math.sin(u.theta));
        n.want = Math.atan2(y, x);
      }
    }
    if (t.key === "raw") ring.sort((a, b) => a.name.localeCompare(b.name));
    else ring.sort((a, b) => ((a.want + 2 * Math.PI) % (2 * Math.PI)) - ((b.want + 2 * Math.PI) % (2 * Math.PI)));
    // even spacing preserves the barycentric order; offset keeps the ring aligned with its parents
    const offset = t.key === "raw" || !ring.length ? 0 :
      d3.mean(ring, (n, i) => angleDiff(n.want, (i / ring.length) * 2 * Math.PI));
    ring.forEach((n, i) => { n.theta = (i / ring.length) * 2 * Math.PI + offset; n.ti = TIER[t.key].i; });
  }
  for (const n of nodes) n.size = 3.2 + Math.min(4.2, Math.sqrt(n.tests || 0) * 0.75) + (n.kind === "source" ? -0.6 : 0);
}
function angleDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

// Each ring turns at its own pace (inner rings faster, like planets)
const speed = ti => 0.006 + (TIERS.length - ti) * 0.0032;
function pos(n) {
  const a = n.theta + rot * speed(n.ti) - Math.PI / 2;
  const r = TIERS[n.ti].r * S;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
function curve(a, b) {
  const [x1, y1] = pos(a), [x2, y2] = pos(b);
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const qx = mx + (cx - mx) * 0.25, qy = my + (cy - my) * 0.25;
  return { x1, y1, qx, qy, x2, y2 };
}
const pathOf = c => `M${c.x1},${c.y1}Q${c.qx},${c.qy} ${c.x2},${c.y2}`;
const bez = (c, t) => [(1 - t) ** 2 * c.x1 + 2 * (1 - t) * t * c.qx + t * t * c.x2,
                       (1 - t) ** 2 * c.y1 + 2 * (1 - t) * t * c.qy + t * t * c.y2];

// ── Status ──────────────────────────────────────────────────────────────────────────────────
function nodeRun(id) {
  if (scope) return scope.nodeRuns.get(id) || null;
  return live.nodes[id] || null;
}
function statusOf(id) {
  const r = nodeRun(id);
  if (!r) return "idle";
  if (r.state === "running") return "running";
  if (r.state === "failed") return "failed";
  if (r.state === "aborted") return "skipped";
  if (!scope && r.ended_at && (Date.now() - new Date(r.ended_at)) / 3.6e6 > (cfg.stale_hours || 26)) return "stale";
  return "success";
}

// ── Static drawing (on resize / data) ───────────────────────────────────────────────────────
function resize() {
  const box = document.getElementById("orbitWrap").getBoundingClientRect();
  W = box.width; H = box.height; S = Math.max(120, Math.min(W, H) / 2 - 18);
  cx = W / 2; cy = H / 2;
  svg.attr("viewBox", `0 0 ${W} ${H}`);
  gRings.selectAll("*").remove();
  for (const t of TIERS) {
    gRings.append("circle").attr("class", "ring").attr("cx", cx).attr("cy", cy).attr("r", t.r * S);
    const count = nodes.filter(n => n.tier === t.key).length;
    if (S < 220) continue;   // too tight for labels; the progress strip names the layers
    gRings.append("text").attr("class", "ring-label").attr("x", cx).attr("y", cy - t.r * S - 6)
      .attr("text-anchor", "middle").text(`${t.label} · ${count}`);
  }
  drawSun();
}

function drawSun() {
  gSun.selectAll("*").remove();
  const defs = svg.select("defs").empty() ? svg.insert("defs", ":first-child") : svg.select("defs");
  defs.selectAll("#sunGrad").remove();
  const g = defs.append("radialGradient").attr("id", "sunGrad");
  g.append("stop").attr("offset", "0%").attr("stop-color", css("--sun-1"));
  g.append("stop").attr("offset", "100%").attr("stop-color", css("--sun-2"));
  const r = S * 0.115;
  gSun.append("circle").attr("cx", cx).attr("cy", cy).attr("r", r * 1.35).attr("fill", css("--sun-2")).attr("opacity", .12);
  gSun.append("circle").attr("cx", cx).attr("cy", cy).attr("r", r).attr("fill", "url(#sunGrad)");
  gSun.append("text").attr("id", "sunBig").attr("x", cx).attr("y", cy + 1).attr("text-anchor", "middle")
    .attr("font-size", Math.max(13, r * 0.42)).attr("font-weight", 700).attr("fill", "#1a1a19");
  gSun.append("text").attr("id", "sunSmall").attr("x", cx).attr("y", cy + r * 0.38).attr("text-anchor", "middle")
    .attr("font-size", Math.max(9, r * 0.17)).attr("fill", "#3a2a10");
}

function drawPlanets() {
  const sel = gPlanets.selectAll("g.planet").data(nodes, d => d.id);
  const enter = sel.enter().append("g").attr("class", "planet")
    .attr("tabindex", 0).attr("role", "button")
    .on("mouseenter", (ev, d) => { hovered = d; showTip(ev, d); })
    .on("mousemove", (ev, d) => showTip(ev, d))
    .on("mouseleave", () => { hovered = null; hideTip(); })
    .on("click", (ev, d) => select(d.id))
    .on("keydown", (ev, d) => { if (ev.key === "Enter") select(d.id); });
  enter.append("circle").attr("class", "hit").attr("r", d => d.size + 5).attr("fill", "transparent");
  enter.append("circle").attr("class", "halo");
  enter.append("circle").attr("class", "body").attr("r", d => d.size);
  refreshPlanets();
}

function refreshPlanets() {
  const touched = scope ? new Set(scope.nodeRuns.keys()) : null;
  const q = query.toLowerCase();
  gPlanets.selectAll("g.planet").each(function (d) {
    const s = statusOf(d.id);
    d.status = s;
    const g = d3.select(this);
    g.classed("dim", (touched && !touched.has(d.id) && d.tier !== "raw") || (q && !d.name.toLowerCase().includes(q)))
     .classed("match", q && d.name.toLowerCase().includes(q))
     .classed("sel", d.id === selected);
    g.select("circle.body").attr("fill", color(s));
    // secondary encoding beyond hue: running = pulsing halo, failed = solid ring, stale = dashed ring
    g.select("circle.halo")
      .attr("r", d.size + 3.5)
      .attr("stroke", s === "idle" || s === "success" ? "none" : color(s))
      .attr("stroke-dasharray", s === "stale" ? "2 2" : null)
      .attr("opacity", s === "running" ? null : 1);
    g.attr("aria-label", `${d.name}: ${STATUS[s].label}`);
  });
  // ripple when a node finishes
  const now = new Map(nodes.map(n => [n.id, n.status]));
  for (const [id, s] of now) {
    const p = prevStatus.get(id);
    if (p && p !== s && (s === "success" || s === "failed")) ripples.push({ id, s, t0: performance.now() });
  }
  prevStatus = now;
  updateSun(); updateProgress();
}

function updateSun() {
  const models = nodes.filter(n => n.kind !== "source");
  const scoped = scope ? models.filter(n => scope.nodeRuns.has(n.id)) : models;
  const ok = scoped.filter(n => n.status === "success").length;
  const run = scoped.filter(n => n.status === "running").length;
  const bad = scoped.filter(n => n.status === "failed").length;
  const base = scoped.length || 1;
  d3.select("#sunBig").text(`${Math.round(ok / base * 100)}%`);
  d3.select("#sunSmall").text(run ? `${run} running` : bad ? `${bad} failed` : scope ? "of run healthy" : "healthy");
}

function updateProgress() {
  const el = document.getElementById("progress");
  el.innerHTML = TIERS.map(t => {
    const ring = nodes.filter(n => n.tier === t.key && (!scope || scope.nodeRuns.has(n.id)));
    const c = d3.rollup(ring, v => v.length, n => n.status);
    const total = ring.length;
    const done = (c.get("success") || 0);
    const segs = STATUS_ORDER.filter(s => c.get(s)).map(s =>
      `<span style="width:${c.get(s) / Math.max(total, 1) * 100}%;background:var(--st-${s})" data-tip="${STATUS[s].label}: ${c.get(s)}"></span>`).join("");
    return `<div class="tier"><div class="name"><span>${t.label}</span><b>${done}/${total}</b></div><div class="bar">${segs}</div></div>`;
  }).join("");
}

// ── Animation loop: orbit motion, lineage edges, comets ─────────────────────────────────────
function frame(t) {
  const dt = Math.min(100, t - lastT); lastT = t;
  if (spinning && !hovered) rot += dt / 1000;
  gPlanets.selectAll("g.planet").attr("transform", d => { const [x, y] = pos(d); return `translate(${x},${y})`; });
  gPlanets.selectAll("g.planet").filter(d => d.status === "running").select("circle.halo")
    .attr("r", d => d.size + 3 + 3 * (0.5 + 0.5 * Math.sin(t / 250)))
    .attr("opacity", 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t / 250)));

  // lineage for hovered / selected node
  const focus = hovered || (selected && byId.get(selected));
  const edges = [];
  if (focus) {
    for (const u of up.get(focus.id)) edges.push({ a: byId.get(u), b: focus, cls: "up" });
    for (const d of down.get(focus.id)) edges.push({ a: focus, b: byId.get(d), cls: "down" });
  }
  gEdges.selectAll("path").data(edges).join("path").attr("class", d => `edge ${d.cls}`).attr("d", d => pathOf(curve(d.a, d.b)));

  // comets: data flowing from upstreams into every running node
  const comets = [];
  for (const n of nodes) {
    if (n.status !== "running") continue;
    up.get(n.id).slice(0, 8).forEach((u, k) => {
      const c = curve(byId.get(u), n);
      for (let j = 0; j < 2; j++) {
        const p = ((t / 1400) + k * 0.17 + j * 0.5) % 1;
        comets.push({ key: `${n.id}|${u}|${j}`, xy: bez(c, p), p });
      }
    });
  }
  gComets.selectAll("circle").data(comets, d => d.key).join("circle").attr("class", "comet")
    .attr("r", d => 1.4 + d.p * 1.6).attr("fill", color("running"))
    .attr("opacity", d => 0.25 + d.p * 0.75)
    .attr("cx", d => d.xy[0]).attr("cy", d => d.xy[1]);

  // finish ripples
  for (let i = ripples.length - 1; i >= 0; i--) if (t - ripples[i].t0 > 1200) ripples.splice(i, 1);
  gFx.selectAll("circle").data(ripples, d => d.id + d.t0).join("circle")
    .attr("fill", "none").attr("stroke", d => color(d.s)).attr("stroke-width", 2)
    .attr("cx", d => pos(byId.get(d.id))[0]).attr("cy", d => pos(byId.get(d.id))[1])
    .attr("r", d => byId.get(d.id).size + (t - d.t0) / 1200 * 22)
    .attr("opacity", d => 1 - (t - d.t0) / 1200);
  requestAnimationFrame(frame);
}

// ── Tooltip ─────────────────────────────────────────────────────────────────────────────────
const tip = document.getElementById("tip");
function showTip(ev, d) {
  const r = nodeRun(d.id), s = statusOf(d.id);
  tip.innerHTML = `<div class="t">${esc(d.name)}</div>
    <div class="row">${ico(s)} ${STATUS[s].label}${r?.ended_at ? ` · ${fmtAgo(r.ended_at)}` : r?.started_at ? ` · started ${fmtAgo(r.started_at)}` : ""}</div>
    <div class="row">${TIER[d.tier].label} · ${esc(d.materialized || d.kind)} · ${d.tests} tests</div>
    ${r?.duration_s != null ? `<div class="row">Duration ${fmtDur(r.duration_s)}${r.rows_affected != null ? ` · ${fmtNum(r.rows_affected)} rows` : ""}</div>` : ""}`;
  tip.style.display = "block";
  placeTip(ev);
}
function placeTip(ev) {
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; }
document.getElementById("progress").addEventListener("mousemove", ev => {
  const t = ev.target.dataset?.tip;
  if (!t) return hideTip();
  tip.innerHTML = `<div class="row">${esc(t)}</div>`; tip.style.display = "block"; placeTip(ev);
});
document.getElementById("progress").addEventListener("mouseleave", hideTip);

// ── Side panel ──────────────────────────────────────────────────────────────────────────────
function tab(name) {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.pane === name));
  document.querySelectorAll(".pane").forEach(p => p.hidden = p.id !== `pane-${name}`);
  if (name === "list") renderList();
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => tab(b.dataset.pane));

function renderRuns() {
  const el = document.getElementById("pane-runs");
  if (!live.dag_runs.length) { el.innerHTML = `<div class="empty">No Airflow runs synced yet.</div>`; return; }
  el.innerHTML = `<div class="muted" style="margin-bottom:8px">Click a run to scope the orbit to it. Click again to clear.</div>` +
    live.dag_runs.map(r => {
      const s = AF_STATE[r.state] || "idle";
      const sel = scope && scope.dag_id === r.dag_id && scope.run_id === r.run_id;
      const total = Math.max(1, r.tasks);
      const other = r.tasks - r.tasks_success - r.tasks_running - r.tasks_failed;
      const seg = (n, st) => n > 0 ? `<span style="width:${n / total * 100}%;background:var(--st-${st})"></span>` : "";
      const dur = r.start_date ? ((r.end_date ? new Date(r.end_date) : Date.now()) - new Date(r.start_date)) / 1000 : null;
      return `<div class="run ${sel ? "sel" : ""}" data-dag="${esc(r.dag_id)}" data-run="${esc(r.run_id)}">
        <div class="top">${ico(s)}<span class="dag">${esc(r.dag_id)}</span><span class="muted">${esc(r.state)}</span></div>
        <div class="meta">${esc(r.run_type || "")} · ${fmtAgo(r.start_date)} · ${fmtDur(dur)} · tasks ${r.tasks_success}/${r.tasks}${r.node_runs ? ` · ${r.node_runs} models` : ""}</div>
        <div class="bar">${seg(r.tasks_success, "success")}${seg(r.tasks_running, "running")}${seg(r.tasks_failed, "failed")}${seg(other, "idle")}</div>
      </div>`;
    }).join("");
  el.querySelectorAll(".run").forEach(div => div.onclick = () => toggleScope(div.dataset.dag, div.dataset.run));
}

async function toggleScope(dag_id, run_id) {
  if (scope && scope.dag_id === dag_id && scope.run_id === run_id) scope = null;
  else scope = { dag_id, run_id, nodeRuns: new Map(), tasks: [] };
  await refreshScope();
  renderRuns();
}
async function refreshScope() {
  const sc = document.getElementById("scope");
  if (!scope) { sc.innerHTML = `Showing <b>latest status</b> of every node`; refreshPlanets(); return; }
  const r = await fetch(`api/dag_runs/${encodeURIComponent(scope.dag_id)}/${encodeURIComponent(scope.run_id)}`).then(r => r.json());
  const m = new Map();
  for (const nr of r.node_runs) if (nr.node_id) m.set(nr.node_id, nr);   // ordered by start, last wins
  scope.nodeRuns = m; scope.tasks = r.tasks;
  sc.innerHTML = `Scoped to <b>${esc(scope.dag_id)}</b> · ${esc(scope.run_id)} <button id="clearScope" style="margin-left:6px;padding:1px 8px">✕ clear</button>`;
  document.getElementById("clearScope").onclick = () => toggleScope(scope.dag_id, scope.run_id);
  refreshPlanets();
}

async function select(id) {
  selected = id; tab("detail");
  gPlanets.selectAll("g.planet").classed("sel", d => d.id === selected);
  const el = document.getElementById("pane-detail");
  const d = await fetch(`api/nodes/${encodeURIComponent(id)}`).then(r => r.json());
  const n = byId.get(id), s = statusOf(id), last = d.runs[0];
  const afLink = r => cfg.airflow_public_url && r.airflow_dag_id && r.airflow_run_id
    ? `<a target="_blank" rel="noopener" href="${cfg.airflow_public_url}/dags/${encodeURIComponent(r.airflow_dag_id)}/runs/${encodeURIComponent(r.airflow_run_id)}${r.airflow_task_id ? `/tasks/${encodeURIComponent(r.airflow_task_id)}` : ""}">${esc(r.airflow_task_id || r.airflow_dag_id)}</a>` : esc(r.airflow_task_id || "—");
  const chips = ids => ids.length ? `<div class="chips">${ids.map(i => { const x = byId.get(i); return x ? `<span class="chip" data-id="${esc(i)}">${ico(statusOf(i))}${esc(x.name)}</span>` : ""; }).join("")}</div>` : `<div class="muted">none</div>`;
  el.innerHTML = `
    <h2>${esc(n.name)}</h2>
    <div class="muted">${esc(n.id)}</div>
    <dl class="kv">
      <dt>Status</dt><dd>${ico(s)} ${STATUS[s].label}</dd>
      <dt>Layer</dt><dd>${TIER[n.tier].label}${n.schema_name ? ` · <code>${esc(n.schema_name)}</code>` : ""}</dd>
      <dt>Materialized</dt><dd>${esc(n.materialized || n.kind)}</dd>
      <dt>Tests</dt><dd>${n.tests}</dd>
      <dt>Last run</dt><dd>${last ? `${fmtAgo(last.started_at)} · ${fmtDur(last.duration_s)}` : "—"}</dd>
      <dt>Rows</dt><dd>${fmtNum(last?.rows_affected)}</dd>
      <dt>Airflow</dt><dd>${last ? afLink(last) : "—"}</dd>
    </dl>
    ${last?.error ? `<h3>Last error</h3><div class="err">${esc(last.error)}</div>` : ""}
    <h3>Upstream (${d.upstream.length})</h3>${chips(d.upstream)}
    <h3>Downstream (${d.downstream.length})</h3>${chips(d.downstream)}
    <h3>Recent runs</h3>
    ${d.runs.length ? `<table><thead><tr><th>Status</th><th>Started</th><th class="num">Duration</th><th>Airflow task</th></tr></thead><tbody>
      ${d.runs.map(r => { const rs = r.state === "running" ? "running" : r.state === "failed" ? "failed" : r.state === "aborted" ? "skipped" : "success";
        return `<tr><td>${ico(rs)} ${STATUS[rs].label}</td><td>${fmtAgo(r.started_at)}</td><td class="num">${fmtDur(r.duration_s)}</td><td>${afLink(r)}</td></tr>`; }).join("")}
    </tbody></table>` : `<div class="muted">No executions recorded yet.</div>`}`;
  el.querySelectorAll(".chip").forEach(c => c.onclick = () => select(c.dataset.id));
}

function renderList() {
  const el = document.getElementById("pane-list");
  const rows = nodes.filter(n => !query || n.name.toLowerCase().includes(query.toLowerCase()))
    .sort((a, b) => STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status) || a.ti - b.ti || a.name.localeCompare(b.name));
  el.innerHTML = `<table><thead><tr><th>Status</th><th>Model</th><th>Layer</th><th class="num">Duration</th></tr></thead><tbody>
    ${rows.map(n => { const r = nodeRun(n.id);
      return `<tr data-id="${esc(n.id)}" style="cursor:pointer"><td>${ico(n.status)} ${STATUS[n.status].label}</td><td>${esc(n.name)}</td><td>${TIER[n.tier].label}</td><td class="num">${fmtDur(r?.duration_s)}</td></tr>`; }).join("")}
  </tbody></table>`;
  el.querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = () => select(tr.dataset.id));
}

function renderLegend() {
  document.getElementById("legend").innerHTML =
    ["success", "running", "failed", "stale", "skipped", "idle"].map(s => `<span class="lg">${ico(s)} ${STATUS[s].label}</span>`).join("") +
    `<span class="lg muted">Planet size = number of tests · hover a planet for lineage (blue = upstream, amber = downstream) · comets = data flowing into running models</span>`;
}

// ── Controls ────────────────────────────────────────────────────────────────────────────────
document.getElementById("spin").onclick = e => { spinning = !spinning; e.currentTarget.setAttribute("aria-pressed", spinning); };
document.getElementById("search").oninput = e => { query = e.target.value.trim(); refreshPlanets(); if (!document.getElementById("pane-list").hidden) renderList(); };
document.getElementById("theme").onclick = () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("orbit-theme", root.dataset.theme); } catch (e) {}
  drawSun(); refreshPlanets(); renderLegend();
};
try { const t = localStorage.getItem("orbit-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
if (matchMedia("(prefers-reduced-motion: reduce)").matches) { spinning = false; document.getElementById("spin").setAttribute("aria-pressed", false); }

// ── Boot ────────────────────────────────────────────────────────────────────────────────────
(async () => {
  cfg = await fetch("api/config").then(r => r.json());
  layout(await fetch("api/topology").then(r => r.json()));
  resize(); drawPlanets(); renderLegend(); renderRuns();
  new ResizeObserver(() => { resize(); }).observe(document.getElementById("orbitWrap"));
  requestAnimationFrame(frame);

  const liveEl = document.getElementById("live");
  const es = new EventSource("api/stream");
  es.onopen = () => { liveEl.classList.add("on"); liveEl.lastElementChild.textContent = "live"; };
  es.onerror = () => { liveEl.classList.remove("on"); liveEl.lastElementChild.textContent = "reconnecting…"; };
  es.addEventListener("state", async ev => {
    live = JSON.parse(ev.data);
    if (scope) await refreshScope(); else refreshPlanets();
    renderRuns();
    if (!document.getElementById("pane-list").hidden) renderList();
  });
})();
</script>
</body>
