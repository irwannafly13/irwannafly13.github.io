    <!-- Fonts are self-hosted from src/assets/fonts and declared in
         src/index.css, so nothing is fetched from a CDN. -->

<!-- Set the theme before first paint so there is no light-mode flash.
         Dark is the default: only an explicit choice of light opts out. -->
    <script>
      ;(function () {
        try {
          var dark = localStorage.getItem('theme') !== 'light'
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
